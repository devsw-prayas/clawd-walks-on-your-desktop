name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/tauri.exe
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install Tauri CLI
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:USERPROFILE\.cargo\bin\tauri.exe")) {
            cargo install tauri-cli --version "^2" --locked
          }

      - name: Build Tauri app
        run: tauri build

      - name: Get version from tauri.conf.json
        id: version
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          echo "tag=v$($conf.version)" >> $env:GITHUB_OUTPUT
          echo "version=$($conf.version)" >> $env:GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_check
        shell: bash
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build artifacts
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: clawd-${{ matrix.platform }}-${{ steps.version.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Clawd ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          body: |
            ## Clawd ${{ steps.version.outputs.tag }}

            ### Assets
            - **Windows NSIS Installer** — `ClawdSetup_${{ steps.version.outputs.version }}_x64.exe`
            - **Windows MSI** — `clawd_${{ steps.version.outputs.version }}_x64_en-US.msi`

            ### Changes
            See [commit history](https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.tag }}) for details.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
